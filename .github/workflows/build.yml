name: build-apk
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Create Android project
        run: |
          set -e
          mkdir -p app/src/main/java/com/nizar/daftar app/src/main/assets
          cp index.html app/src/main/assets/index.html
          curl -sfL https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js -o app/src/main/assets/xlsx.full.min.js
          sed -i 's#https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js#xlsx.full.min.js#' app/src/main/assets/index.html
          cat > app/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = 'daftar'
          EOF
          cat > app/gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' }
          android {
            namespace 'com.nizar.daftar'
            compileSdk 34
            defaultConfig {
              applicationId 'com.nizar.daftar'
              minSdk 23
              targetSdk 34
              versionCode 1
              versionName '1.0'
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.SEND_SMS"/>
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:label="دفتر الدين" android:theme="@android:style/Theme.Material.Light.NoActionBar">
              <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize|keyboardHidden" android:windowSoftInputMode="adjustResize">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/nizar/daftar/MainActivity.java <<'EOF'
          package com.nizar.daftar;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Bundle;
          import android.telephony.SmsManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import java.util.ArrayList;

          public class MainActivity extends Activity {
            private WebView web;
            private ValueCallback<Uri[]> fileCb;

            @Override
            protected void onCreate(Bundle b) {
              super.onCreate(b);
              web = new WebView(this);
              setContentView(web);
              WebSettings s = web.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setAllowFileAccess(true);
              web.addJavascriptInterface(new Bridge(), "AndroidSms");
              web.setWebViewClient(new WebViewClient());
              web.setWebChromeClient(new WebChromeClient() {
                @Override
                public boolean onShowFileChooser(WebView v, ValueCallback<Uri[]> cb, FileChooserParams p) {
                  if (fileCb != null) fileCb.onReceiveValue(null);
                  fileCb = cb;
                  Intent i = new Intent(Intent.ACTION_GET_CONTENT);
                  i.addCategory(Intent.CATEGORY_OPENABLE);
                  i.setType("*/*");
                  startActivityForResult(Intent.createChooser(i, "اختر ملف Excel"), 1);
                  return true;
                }
              });
              web.loadUrl("file:///android_asset/index.html");
              if (!granted()) askSms();
            }

            private boolean granted() {
              return checkSelfPermission(Manifest.permission.SEND_SMS) == PackageManager.PERMISSION_GRANTED;
            }

            private void askSms() {
              requestPermissions(new String[]{Manifest.permission.SEND_SMS}, 2);
            }

            @Override
            protected void onActivityResult(int req, int res, Intent data) {
              if (req == 1 && fileCb != null) {
                Uri[] r = null;
                if (res == RESULT_OK && data != null && data.getData() != null) r = new Uri[]{data.getData()};
                fileCb.onReceiveValue(r);
                fileCb = null;
              }
            }

            @Override
            public void onBackPressed() {
              if (web.canGoBack()) web.goBack(); else super.onBackPressed();
            }

            class Bridge {
              @JavascriptInterface
              public String hasPermission() { return granted() ? "yes" : "no"; }

              @JavascriptInterface
              public void askPermission() { runOnUiThread(() -> askSms()); }

              @JavascriptInterface
              public String send(String phone, String msg) {
                if (!granted()) return "no-permission";
                try {
                  SmsManager sm = SmsManager.getDefault();
                  ArrayList<String> parts = sm.divideMessage(msg);
                  sm.sendMultipartTextMessage(phone, null, parts, null, null);
                  return "ok";
                } catch (Exception e) {
                  return "error";
                }
              }
            }
          }
          EOF
      - name: Build APK
        working-directory: app
        run: gradle assembleDebug --no-daemon
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/*.apk daftar-aldeen.apk
          gh release delete latest -y --cleanup-tag || true
          gh release create latest daftar-aldeen.apk --title "دفتر الدين" --notes "آخر نسخة من التطبيق"
